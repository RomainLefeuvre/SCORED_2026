
services:
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swhosv
    volumes:
      - ./data:/var/lib/postgresql/data  # This maps the local 'data' folder to the container's data directory
      - ./init-hba.sh:/docker-entrypoint-initdb.d/init-hba.sh
    ports:
      - "5433:5432"
    shm_size: 1T
    command:
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "max_wal_size=20GB"
      - "-c"
      - "max_wal_senders=0"